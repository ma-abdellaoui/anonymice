services:
  litellm:
    image: anonymice:local
    container_name: anonymice
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    #########################################
    ## Uncomment these lines to start proxy with a config.yaml file ##
    # volumes:
    #  - ./config.yaml:/app/config.yaml
    # command:
    #  - "--config=/app/config.yaml"
    ##############################################
    ports:
      - "4000:4000" # Map the container port to the host, change the host port if necessary
    environment:
      DATABASE_URL: "postgresql://llmproxy:dbpassword9090@db:5432/litellm"
      # Optional: route read-only queries (find_*, count, group_by, query_raw/_first)
      # to a separate reader endpoint, e.g. an Aurora reader. Leave unset for
      # single-DB deployments. With IAM_TOKEN_DB_AUTH enabled, the reader URL
      # is auto-refreshed alongside the writer.
      # DATABASE_URL_READ_REPLICA: "postgresql://llmproxy:dbpassword9090@db-reader:5432/litellm"
      STORE_MODEL_IN_DB: "True" # allows adding models to proxy via UI
      PRESIDIO_ANALYZER_API_BASE: "http://presidio:3000"
      # Mandatory second stage. Without it the rules stage covers only pattern
      # and checksum entities, so names would reach the provider in the clear
      # and the guardrail refuses every request.
      LITELLM_PII_NER_API_BASE: "http://piiranha:8080"
    env_file:
      - .env # Load local .env file
    depends_on:
      - db  # Indicates that this service depends on the 'db' service, ensuring 'db' starts first
      - presidio  # PII detection; the guardrail and /pii routes are inert without it
      - piiranha  # NER stage; names are undetectable without it
    healthcheck:  # Defines the health check configuration for the container
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"  # Command to execute for health check
      interval: 30s  # Perform health check every 30 seconds
      timeout: 10s   # Health check command times out after 10 seconds
      retries: 3     # Retry up to 3 times if health check fails
      start_period: 40s  # Wait 40 seconds after container start before beginning health checks

  db:
    image: postgres:16
    restart: always
    container_name: litellm_db
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persists Postgres data across container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10

  presidio:
    # The PII anonymizer guardrail's first detection stage. Without it the
    # guardrail and every /pii route answer 501, so it belongs in the stack
    # rather than in a local overlay.
    #
    # Built locally rather than pulled: the stock image registers English only
    # and rejects German outright, and the corpus this proxy serves is German.
    build:
      context: ./docker/presidio
    image: anonymice/pii-rules:local
    restart: always
    ports:
      - "5002:3000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  piiranha:
    # Model-based NER stage. Built locally because the weights are baked into
    # the image at build time rather than fetched on start.
    build:
      context: ./docker/piiranha
    image: anonymice/pii-ner:local
    restart: always
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    restart: always

volumes:
  prometheus_data:
    driver: local
  postgres_data:
    name: litellm_postgres_data # Named volume for Postgres data persistence
